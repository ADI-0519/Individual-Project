minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        entry: python -m pre_commit_hooks.check_added_large_files
        args: [--maxkb=1000]
        # Reviewed 128-case source bank is 1.13 MiB; raw runs remain ignored.
        exclude: ^(uv\.lock|data/belief_diagnostic/contrast_validation_v1\.json)$
      - id: check-merge-conflict
        entry: python -m pre_commit_hooks.check_merge_conflict
      - id: check-yaml
        entry: python -m pre_commit_hooks.check_yaml
      - id: check-toml
        entry: python -m pre_commit_hooks.check_toml
      - id: detect-private-key
        entry: python -m pre_commit_hooks.detect_private_key
      - id: end-of-file-fixer
        entry: python -m pre_commit_hooks.end_of_file_fixer
        exclude: ^data/annotations/.*_agent_draft\.csv$
      - id: trailing-whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
        args: [--markdown-linebreak-ext=md]
        # Preserve the exact quoted evidence in byte-hashed annotation drafts.
        exclude: ^data/annotations/.*_agent_draft\.csv$
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (locked environment)
        require_serial: true
        entry: uv run --locked --group dev python -m ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format (locked environment)
        require_serial: true
        entry: uv run --locked --group dev python -m ruff format --check
        language: system
        types_or: [python, pyi]
