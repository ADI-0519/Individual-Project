name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_PROGRESS: "1"

jobs:
  tests:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: ${{ matrix.os }}-${{ matrix.python }}
      - name: Install lightweight development dependencies
        run: uv sync --locked --group dev
      - name: Run offline fixture tests with coverage
        run: uv run --locked python -m pytest tests -m "not model" --cov=latent_probes --cov-report=term-missing --cov-report=xml
      - name: Retain coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  presentation:
    name: Rebuild measured Progress 2
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: presentation
      - name: Install locked presentation dependencies
        run: uv sync --locked --extra slides --group dev
      - name: Rebuild editable deck and vector PDF from measured data
        run: >-
          uv run --locked --extra slides python scripts/update_progress2.py
          --results presentations/progress2/Progress-2-measured-results.json
          --pptx .cache/progress2-check.pptx
          --pdf .cache/progress2-check.pdf
      - name: Retain checked presentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: progress2-presentation-check
          path: |
            .cache/progress2-check.pptx
            .cache/progress2-check.pdf
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: quality
      - name: Install lightweight development dependencies
        run: uv sync --locked --group dev
      - name: Check lint
        run: uv run --locked python -m ruff check .
      - name: Check formatting
        run: uv run --locked python -m ruff format --check .
      - name: Check Bash job script syntax
        shell: bash
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Check repository hygiene
        run: uv run --locked python -m pre_commit run --all-files
      - name: Build source and wheel distributions
        run: uv run --locked python -m build --no-isolation
      - name: Check package metadata
        run: uv run --locked python -m twine check dist/*
      - name: Retain validated packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
