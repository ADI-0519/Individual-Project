name: Model smoke (manual CPU)

# Explicit engineering check of a public tiny checkpoint, never a PR requirement
# or a deception-detection research result. No arbitrary model/input parameters.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real-model CPU engineering smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      PYTHONHASHSEED: "42"
      PYTHONDONTWRITEBYTECODE: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: model-smoke-cpu
      - name: Install CPU model dependencies
        run: uv sync --locked --group dev --extra models --extra cpu
      - name: Prepare engineering logs
        run: |
          mkdir -p runs/smoke_logs
          printf 'HF_HOME=%s/huggingface\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Record CPU runtime
        run: |
          uv run --locked --extra models --extra cpu python -m latent_probes doctor \
            2>&1 | tee runs/smoke_logs/00_runtime.log
      - name: Fetch verified upstream facts
        run: |
          uv run --locked --extra models --extra cpu python -m latent_probes apollo fetch-facts \
            --output data/raw/apollo-pinned \
            2>&1 | tee runs/smoke_logs/01_fetch.log
      - name: Prepare eight engineering fact pairs
        run: |
          uv run --locked --extra models --extra cpu python -m latent_probes apollo prepare \
            --facts data/raw/apollo-pinned/true_false_facts.csv \
            --output data/processed/apollo_smoke_pairs.jsonl \
            --limit 8 --short-fact-policy exclude --duplicate-fact-policy exclude \
            2>&1 | tee runs/smoke_logs/02_prepare.log
      - name: Extract actual fixed-response activations
        run: |
          uv run --locked --extra models --extra cpu python -m latent_probes apollo extract \
            --config configs/apollo_smoke_cpu.json \
            --examples data/processed/apollo_smoke_pairs.jsonl \
            --output runs/apollo_smoke_cpu \
            2>&1 | tee runs/smoke_logs/03_extract_pairs.log
      - name: Fit engineering probe
        run: |
          uv run --locked --extra models --extra cpu python -m latent_probes apollo train \
            --features runs/apollo_smoke_cpu/features.npz \
            --labels runs/apollo_smoke_cpu/metadata.csv \
            --output runs/apollo_smoke_probe \
            2>&1 | tee runs/smoke_logs/04_train.log
      - name: Generate actual neutral-control responses
        run: |
          uv run --locked --extra models --extra cpu python -m latent_probes apollo extract \
            --config configs/apollo_smoke_cpu.json \
            --examples data/examples/apollo_smoke_controls.jsonl \
            --output runs/apollo_smoke_controls \
            2>&1 | tee runs/smoke_logs/05_extract_controls.log
      - name: Score engineering controls
        run: |
          uv run --locked --extra models --extra cpu python -m latent_probes apollo score \
            --features runs/apollo_smoke_controls/features.npz \
            --probe runs/apollo_smoke_probe \
            --output runs/apollo_smoke_control_scores.csv \
            2>&1 | tee runs/smoke_logs/06_score.log
      - name: Check threshold plumbing on tiny controls
        run: |
          uv run --locked --extra models --extra cpu python -m latent_probes apollo calibrate \
            --scores runs/apollo_smoke_control_scores.csv \
            --output runs/apollo_smoke_threshold.json \
            2>&1 | tee runs/smoke_logs/07_calibrate.log
      - name: Validate genuine model traces and causal prefix invariance
        run: |
          uv run --locked --extra models --extra cpu python scripts/validate_model_smoke.py \
            2>&1 | tee runs/smoke_logs/08_validate.log
      - name: Enforce small artifact budget
        id: artifact_size
        if: always()
        run: |
          if [[ -d runs ]]; then
            size_bytes=$(du -sb runs | cut -f1)
            printf 'Smoke artifact bytes: %s (maximum 5242880)\n' "$size_bytes"
            test "$size_bytes" -le 5242880
          fi
      - name: Retain engineering traces and logs
        if: ${{ always() && steps.artifact_size.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-smoke-engineering-traces
          path: |
            runs/apollo_smoke_cpu/
            runs/apollo_smoke_probe/
            runs/apollo_smoke_controls/
            runs/apollo_smoke_control_scores.csv
            runs/apollo_smoke_control_scores.csv.manifest.json
            runs/apollo_smoke_threshold.json
            runs/apollo_smoke_validation.json
            runs/smoke_logs/
          if-no-files-found: warn
          retention-days: 14
